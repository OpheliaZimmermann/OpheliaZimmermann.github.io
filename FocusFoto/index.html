<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#17A2B8">
  <title>Focus Foto — Home</title>
  <link rel="stylesheet" href="./style.css?v=5" />
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="brand">Focus Foto</div>

        <!-- menu toggle (only mobile) -->
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Ouvrir le menu">⋯</button>

        <!-- nav links -->
        <div id="site-menu" class="nav-links">
          <a href="./index.html">Home</a>
          <a href="./dist/about_me.html">About</a>
          <a href="./dist/contact.html">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Gallerie</h1>
    <p class="lead">Aperçu de mon travail — portrait, paysage et divers évènements.</p>

    <section class="gallery-grid">
      <a href="./dist/gallery/portrait.jpg" class="tile" data-title="Portrait">
        <img src="./dist/gallery/portrait.jpg" alt="Portrait" loading="lazy">
      </a>
      <a href="./dist/gallery/barbie.jpg" class="tile" data-title="Joy">
        <img src="./dist/gallery/barbie.jpg" alt="Joy" loading="lazy">
      </a>
      <a href="./dist/gallery/piano.jpg" class="tile" data-title="Piano">
        <img src="./dist/gallery/piano.jpg" alt="Piano" loading="lazy">
      </a>
      <a href="./dist/gallery/regard.jpg" class="tile" data-title="Love">
        <img src="./dist/gallery/regard.jpg" alt="Love" loading="lazy">
      </a>
      <a href="./dist/gallery/brouillard.jpg" class="tile" data-title="Brouillard">
        <img src="./dist/gallery/brouillard.jpg" alt="Brouillard" loading="lazy">
      </a>
      <a href="./dist/gallery/well.jpg" class="tile" data-title="Couleur">
        <img src="./dist/gallery/well.jpg" alt="Couleur" loading="lazy">
      </a>
      <a href="./dist/gallery/velo.jpg" class="tile" data-title="Mouvement">
        <img src="./dist/gallery/velo.jpg" alt="Mouvement" loading="lazy">
      </a>
      <a href="./dist/gallery/gateau.jpg" class="tile" data-title="gateau">
        <img src="./dist/gallery/gateau.jpg" alt="gateau" loading="lazy">
      </a>
      <a href="./dist/gallery/ambiance.jpg" class="tile" data-title="ambiance">
        <img src="./dist/gallery/ambiance.jpg" alt="ambiance" loading="lazy">
      </a>
      <a href="./dist/gallery/landing_photo.jpg" class="tile" data-title="norway">
        <img src="./dist/gallery/landing_photo.jpg" alt="norway" loading="lazy">
      </a>
      <a href="./dist/gallery/ecrit.jpg" class="tile" data-title="ecrit">
        <img src="./dist/gallery/ecrit.jpg" alt="ecrit" loading="lazy">
      </a>
      <a href="./dist/gallery/shoes.jpg" class="tile" data-title="shoe">
        <img src="./dist/gallery/shoes.jpg" alt="shoe" loading="lazy">
      </a>
    </section>
  </main>

  <footer>
    <div class="container">
      © Ophelia Zimmermann — All rights reserved ·
      <a href="./dist/impressum.html">Impressum</a> ·
      <a href="./dist/privacy.html">Privacy</a>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close" aria-label="Fermer">✕</button>
    <button class="prev" aria-label="Précédent">‹</button>
    <img src="" alt="" />
    <button class="next" aria-label="Suivant">›</button>
  </div>

  <script>
  // menu mobile
  (function(){
    const btn=document.querySelector('.menu-toggle');
    const menu=document.getElementById('site-menu');
    if(!btn||!menu)return;
    const close=()=>{menu.classList.remove('open');btn.setAttribute('aria-expanded','false');};
    btn.addEventListener('click',()=>{
      const open=menu.classList.toggle('open');
      btn.setAttribute('aria-expanded',open);
    });
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape')close();
    });
    menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));
  })();
  </script>
</body>
</html>
