<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#17A2B8">
  <title>Focus Foto — Home</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="brand">Focus Foto</div>
        <div class="nav-links">
          <a href="./index.html" aria-current="page">Home</a>
          <a href="./dist/about_me.html">About</a>
          <a href="./dist/contact.html">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Gallerie</h1>
    <p class="lead">Aperçu de mon travail — portrait, paysage et divers évènements.</p>

    <section class="gallery-grid" id="gallery">
      <a href="./dist/gallery/portrait.jpg" class="tile" data-title="Portrait">
        <img src="./dist/gallery/portrait.jpg" alt="Portrait" loading="lazy" decoding="async">
      </a>

      <a href="./dist/gallery/barbie.jpg" class="tile" data-title="Joy">
        <img src="./dist/gallery/barbie.jpg" alt="Joy" loading="lazy" decoding="async">
      </a>

      <a href="./dist/gallery/piano.jpg" class="tile" data-title="Piano">
        <img src="./dist/gallery/piano.jpg" alt="Piano" loading="lazy" decoding="async">
      </a>

      <a href="./dist/gallery/regard.jpg" class="tile" data-title="Love">
        <img src="./dist/gallery/regard.jpg" alt="Love" loading="lazy" decoding="async">
      </a>

      <a href="./dist/gallery/brouillard.jpg" class="tile" data-title="Brouillard">
        <img src="./dist/gallery/brouillard.jpg" alt="Brouillard" loading="lazy" decoding="async">
      </a>

      <a href="./dist/gallery/well.jpg" class="tile" data-title="Couleur">
        <img src="./dist/gallery/well.jpg" alt="Couleur" loading="lazy" decoding="async">
      </a>

      <a href="./dist/gallery/velo.jpg" class="tile" data-title="Mouvement">
        <img src="./dist/gallery/velo.jpg" alt="Mouvement" loading="lazy" decoding="async">
      </a>

      <a href="./dist/gallery/fruits.jpg" class="tile" data-title="Brochette">
        <img src="./dist/gallery/fruits.jpg" alt="Brochette" loading="lazy" decoding="async">
      </a>

      <a href="./dist/gallery/gateau.jpg" class="tile" data-title="Gâteau">
        <img src="./dist/gallery/gateau.jpg" alt="Gâteau" loading="lazy" decoding="async">
      </a>

      <a href="./dist/gallery/landing_photo.jpg" class="tile" data-title="Paysage">
        <img src="./dist/gallery/landing_photo.jpg" alt="Paysage" loading="lazy" decoding="async">
      </a>
    </section>
  </main>

  <footer>
    <div class="container">
      © Ophelia Zimmermann — All rights reserved ·
      <a href="./dist/impressum.html">Impressum</a> ·
      <a href="./dist/privacy.html">Privacy</a>
    </div>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close" aria-label="Close">✕</button>
    <button class="prev" aria-label="Previous">‹</button>
    <img src="" alt="" />
    <button class="next" aria-label="Next">›</button>
  </div>

  <script>
  (function(){
    const tiles = Array.from(document.querySelectorAll('.tile'));
    const lb = document.getElementById('lightbox');
    const img = lb.querySelector('img');
    const close = lb.querySelector('.close');
    const prev = lb.querySelector('.prev');
    const next = lb.querySelector('.next');
    let i = 0;

    function open(n){
      i = n;
      const a = tiles[i];
      img.src = a.getAttribute('href');
      img.alt = a.dataset.title || a.querySelector('img')?.alt || '';
      lb.classList.add('open');
      lb.setAttribute('aria-hidden','false');
      document.body.style.overflow='hidden';
    }
    function closeLb(){
      lb.classList.remove('open');
      lb.setAttribute('aria-hidden','true');
      document.body.style.overflow='';
      img.src = '';
    }
    function step(d){
      i = (i + d + tiles.length) % tiles.length;
      open(i);
    }

    tiles.forEach((a,idx)=> a.addEventListener('click', e => { e.preventDefault(); open(idx); }));
    close.addEventListener('click', closeLb);
    prev.addEventListener('click', ()=>step(-1));
    next.addEventListener('click', ()=>step(1));
    lb.addEventListener('click', (e)=>{ if(e.target === lb) closeLb(); });
    document.addEventListener('keydown', (e)=>{
      if(!lb.classList.contains('open')) return;
      if(e.key === 'Escape') closeLb();
      if(e.key === 'ArrowLeft') step(-1);
      if(e.key === 'ArrowRight') step(1);
    });

    // Simple swipe support for mobile
    let sx = 0, sy = 0, touching = false;
    lb.addEventListener('touchstart', (e)=>{
      if(!lb.classList.contains('open')) return;
      const t = e.changedTouches[0];
      sx = t.clientX; sy = t.clientY; touching = true;
    }, {passive:true});
    lb.addEventListener('touchend', (e)=>{
      if(!touching) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx;
      const dy = t.clientY - sy;
      touching = false;
      if(Math.abs(dx) > 40 && Math.abs(dy) < 60){
        if(dx < 0) step(1); else step(-1);
      }
    });
  })();
  </script>
</body>
</html>
