<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Focus Foto</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="brand">Focus Foto</div>

        <!-- menu toggle (only mobile) -->
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Ouvrir le menu">⋯</button>

        <!-- nav links -->
        <div id="site-menu" class="nav-links">
          <a href="../index.html">Home</a>
          <a href="../dist/about_me.html">About</a>
          <a href="../dist/contact.html">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Let’s plan your shoot</h1>
    <p class="lead">Tell me a bit about you and what you have in mind.</p>

    <section class="section grid-2">
      <div class="card">
        <!-- NOTE: GitHub Pages has no backend. The form below opens the user's email client. 
             Replace the email with your own. For advanced handling, use a service like Formspree or Netlify Forms. -->
        <form action="mailto:ophelia.zimmermann@protonmail.com" method="post" enctype="text/plain">
          <div class="form-row">
            <div>
              <label for="name">Votre nom et prénom</label>
              <input id="name" name="Name" type="text" required />
            </div>
            <div>
              <label for="email">Email</label>
              <input id="email" name="Email" type="email" required />
            </div>
          </div>

          <div class="form-row">
            <div>
              <label for="date">Date de l'évènement </label>
              <input id="date" name="Preferred date" type="date" />
            </div>
            <div>
              <label for="location">Lieu</label>
              <input id="location" name="Location" type="text" placeholder="Genève, Nyon, Lausanne etc." />
            </div>
          </div>

          <div>
            <label for="type">Type de projet</label>
            <input id="type" name="Project type" type="text" placeholder="Portrait / Couple / Evenement..." />
          </div>

          <div>
            <label for="message">Message</label>
            <textarea id="message" name="Message" placeholder="Envie de me décrire le projet plus en détails?" required></textarea>
            <p class="helper">En cliquant sur "Envoyer" vous acceptez la <a href="../dist/privacy.html">politique de confidentialité.</p>
          </div>

          <div>
            <button class="btn primary" type="submit">Envoyer</button>
            <a class="btn" href="ophelia.zimmermann@protonmail.com">Ou envoyez-moi un email directement !</a>
          </div>
        </form>
      </div>

    </section>
  </main>

  <footer>
  <div class="container">
    © Ophelia Zimmermann — All rights reserved · 
    <a href="../dist/impressum.html">Impressum</a> · 
    <a href="../dist/privacy.html">Privacy</a>
  </div>
</footer>
</body>
</html>
