  <style>
    /* === Formulaire lisible et espacé === */
    main .card form {
      max-width: 760px;
      margin: 0 auto;
      font-size: 1.05rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      box-shadow: var(--shadow);
      transition: border-color 0.2s ease;
    }

    input:focus, textarea:focus {
      border-color: #17A2B8;
      outline: none;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    .helper {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    @media (max-width: 700px) {
      main .card form {
        max-width: 100%;
        gap: 1.2rem;
      }
    }
  </style>
</head>

    <div class="container">
      <nav>
        <div class="brand">Focus Foto</div>

        <!-- menu toggle (only mobile) -->
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Ouvrir le menu">⋯</button>

        <!-- nav links -->

          <a href="../index.html">Home</a>
          <a href="../dist/about_me.html">About</a>

        </div>
      </nav>
    </div>

  <main class="container">
    <h1>Planifions votre séance</h1>
    <p class="lead">Parlez-moi un peu de vous et de votre projet photo.</p>
<form id="contact-form" action="https://formspree.io/f/xwpwgykk" method="POST">
  <!-- Champ anti-spam (honeypot) -->
  <input type="text" name="_gotcha" style="display:none">

  <div>
    <label for="name">Votre nom et prénom</label>
    <input id="name" name="name" type="text" required />
  </div>

  <div>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required />
  </div>

  <div>
    <label for="date">Date de l'évènement</label>
    <input id="date" name="date" type="date" />
  </div>

  <div>
    <label for="location">Lieu</label>
    <input id="location" name="location" type="text" placeholder="Genève, Nyon, Lausanne etc." />
  </div>

  <div>
    <label for="type">Type de projet</label>
    <input id="type" name="project_type" type="text" placeholder="Portrait / Couple / Évènement..." />
  </div>

  <div>
    <label for="message">Message</label>
    <textarea id="message" name="message" placeholder="Décrivez votre projet..." required></textarea>
    <p class="helper">
      En cliquant sur "Envoyer", vous acceptez la 
      <a href="../dist/privacy.html">politique de confidentialité</a>.
    </p>
  </div>

  <!-- Sujet et redirection (facultatif mais utile) -->
  <input type="hidden" name="_subject" value="Nouveau message depuis le site Focus Foto">
  <input type="hidden" name="_redirect" value="https://opheliazimmermann.github.io/dist/merci.html">

  <div>
    <button class="btn primary" type="submit">Envoyer</button>
    <button class="btn" type="button"
        onclick="window.location.href='mailto:ophelia.zimmermann@protonmail.com'">
  Ou email direct
</button>
  <p id="form-status" class="helper" aria-live="polite"></p>
</form>

  <!-- JS menu mobile -->
  <script>
  (function(){
    const btn=document.querySelector('.menu-toggle');
    const menu=document.getElementById('site-menu');
    if(!btn||!menu)return;
    const close=()=>{menu.classList.remove('open');btn.setAttribute('aria-expanded','false');};
    btn.addEventListener('click',()=>{
      const open=menu.classList.toggle('open');
      btn.setAttribute('aria-expanded',open);
    });
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape')close();
    });
    menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));
  })();
  </script>
